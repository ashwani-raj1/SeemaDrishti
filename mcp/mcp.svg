<svg xmlns="http://www.w3.org/2000/svg" width="760" height="200" viewBox="0 0 760 200" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="760" height="200" rx="12" fill="#ffffff" stroke="#e2e8f0"/>

  <!-- Clients -->
  <rect x="20" y="30" width="150" height="60" rx="10" fill="#fdf4ff" stroke="#c026d3"/>
  <text x="95" y="56" text-anchor="middle" font-size="13" font-weight="600" fill="#701a75">Investigation Agent</text>
  <text x="95" y="74" text-anchor="middle" font-size="11" fill="#86198f">agent/ (Google ADK)</text>
  <rect x="20" y="110" width="150" height="60" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="95" y="136" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">Claude Code / any</text>
  <text x="95" y="154" text-anchor="middle" font-size="11" fill="#475569">MCP client</text>

  <!-- MCP server -->
  <rect x="230" y="20" width="300" height="160" rx="10" fill="#eef2ff" stroke="#6366f1"/>
  <text x="380" y="44" text-anchor="middle" font-size="14" font-weight="600" fill="#312e81">SeemaDrishti MCP · Go :13000/mcp</text>
  <text x="380" y="62" text-anchor="middle" font-size="11" fill="#4338ca">streamable HTTP · stateless · read-only tools</text>
  <rect x="246" y="74" width="130" height="24" rx="5" fill="#ffffff" stroke="#c7d2fe"/>
  <text x="311" y="90" text-anchor="middle" font-size="11" fill="#334155">cameras · zones</text>
  <rect x="384" y="74" width="130" height="24" rx="5" fill="#ffffff" stroke="#c7d2fe"/>
  <text x="449" y="90" text-anchor="middle" font-size="11" fill="#334155">events · incidents</text>
  <rect x="246" y="106" width="130" height="24" rx="5" fill="#ffffff" stroke="#c7d2fe"/>
  <text x="311" y="122" text-anchor="middle" font-size="11" fill="#334155">clips · frames</text>
  <rect x="384" y="106" width="130" height="24" rx="5" fill="#ffffff" stroke="#c7d2fe"/>
  <text x="449" y="122" text-anchor="middle" font-size="11" fill="#334155">plate + person watchlist</text>
  <text x="380" y="160" text-anchor="middle" font-size="11" fill="#64748b">forwards x-ibvap-actor to backend</text>

  <!-- Backend -->
  <rect x="590" y="70" width="150" height="60" rx="10" fill="#ecfdf5" stroke="#059669"/>
  <text x="665" y="96" text-anchor="middle" font-size="13" font-weight="600" fill="#064e3b">Backend :8000</text>
  <text x="665" y="114" text-anchor="middle" font-size="11" fill="#047857">REST /api/*</text>

  <!-- Arrows -->
  <line x1="170" y1="60" x2="228" y2="80" stroke="#475569" stroke-width="1.6" marker-end="url(#a)" marker-start="url(#a)"/>
  <line x1="170" y1="140" x2="228" y2="120" stroke="#475569" stroke-width="1.6" marker-end="url(#a)" marker-start="url(#a)"/>
  <line x1="530" y1="100" x2="588" y2="100" stroke="#475569" stroke-width="1.6" marker-end="url(#a)" marker-start="url(#a)"/>
</svg>
