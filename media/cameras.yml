# The camera manifest — what cameras exist and what runs on each.
#
# Read by:  media/configure.py  (writes media/mediamtx.yml — the hub paths)
#           media/fetch.py      (downloads / re-encodes clips)
#           ibvap/config.py     (the vision service — which cameras, which modules)
# NOT read by the backend. The backend's `camera` table is a separate list
# (see `id` below), and the console shows the table's `name`, not `label`.
#
# This file says WHAT cameras exist. `.env` says WHERE things run and which of
# these cameras THIS machine handles (IBVAP_WORKER_CAMERAS). Zones are never
# written here — they are drawn in the console and pulled from the node.
#
# After editing: python media/configure.py, restart mediamtx, restart
# ibvap/main.py. (Careful: `fetch.py --url` rewrites this file and drops every
# comment in it.)

# ═══════════════════════════════════════════════════════════════════════
# KEY REFERENCE  (every key the code reads — nothing else has any effect)
# ═══════════════════════════════════════════════════════════════════════
#
# ── top level ───────────────────────────────────────────────────────────
#
#   defaults:   keys merged into every camera block. SHALLOW merge — a
#               camera's own `modules:` or `source:` replaces the default
#               wholesale, it does not combine with it.
#   cameras:    the list of camera blocks.
#
# ── per camera ──────────────────────────────────────────────────────────
#
#   id          REQUIRED. Unique. Letters, digits, `_`, `-` only.
#               It is the hub path (rtsp://<host>:8554/<id>), the WHEP path,
#               and the camera_id on every event. It MUST match a row in the
#               backend's `camera` table (backend/ibvap.db) or the node rejects
#               every event with "unknown camera <id>" — video plays, nothing is
#               recorded. Add a missing row with the console's "Add to the node"
#               or POST /api/cameras {id, name}.
#
#   label       Display text for the vision service's logs and the overlay
#               burned into `fetch.py --synthetic` clips. Default: the id.
#               The console's camera name comes from the DB row, not this —
#               change it there (PATCH /api/cameras/<id> {name}).
#
#   detect      true | false. Whether the vision service runs on this camera.
#               false = video only (live tile, no boxes).
#               ALWAYS WRITE IT. If omitted, ibvap treats it as false, while
#               configure.py treats it as true when picking launcher cameras —
#               the two disagree.
#
#   simulated   true | false. Stamped on every event; the console shows a
#               SIMULATED badge. Default: true when source.kind is `file`,
#               false otherwise. Set false for replayed footage you want treated
#               as operational.
#
#   imgsz       YOLO inference size for this camera only (e.g. 640 for a
#               plate-facing gate). Default: IBVAP_IMGSZ — but configure.py
#               launches the service with --imgsz 384, which wins over .env.
#               Bigger = small objects/plates detected, more CPU.
#
#   height      Only used by fetch.py: the height clips are scaled to when it
#               downloads, normalises or synthesises them (synthetic default
#               480). null / omitted = keep the source resolution.
#               NO effect at runtime — the hub publishes the file as-is.
#
#   modules     Which modules run on the shared YOLO+ByteTrack pass. Either:
#                   modules: [fence, anpr]            names, default params
#                   modules:                          names with params
#                     fence: {confirm_frames: 4}
#               Omitted → defaults.modules → built-in {fence, multi_human}.
#               Available: fence, anpr, multi_human, face (params below).
#
#   source      REQUIRED. Where the video comes from.
#     kind        file (default) | rtsp | webcam
#     file:   path    REQUIRED. Relative to media/ (e.g. clips/x.mp4).
#                     Must be H.264, no B-frames, yuv420p, or the tile stays
#                     black — `python media/fetch.py --normalise` fixes that.
#             url     Optional. Any yt-dlp URL; `fetch.py` downloads it into
#                     `path` when the file is missing (≤720p, trimmed to
#                     --seconds, default 120; --seconds 0 keeps all).
#     rtsp:   url     REQUIRED. rtsp://user:pass@10.0.0.14:554/... — the hub
#                     pulls it directly; credentials stay on the hub machine.
#     webcam: device  REQUIRED. DirectShow name, from
#                     ffmpeg -list_devices true -f dshow -i dummy
#
# ── module params (all optional; defaults shown) ────────────────────────
#
#   fence
#     confirm_frames: 3        frames a crossing must hold (AND confirm_seconds
#                              from the zone — both clocks must agree)
#     cooldown_seconds: 20     per (track, zone, direction) before re-alerting
#     clips: false             keep a frame ring and attach an evidence clip to
#                              each confirmed crossing (costs RAM, see core/clip.py)
#     clip_pre_seconds: 4      seconds kept before the crossing
#     clip_post_seconds: 2     seconds kept after
#     (`zones` is overwritten from the node every refresh — never set it here)
#
#   anpr                       (loads EasyOCR — heavy; enable only where plates
#                              face the camera)
#     ocr_every: 1             OCR every Nth processed frame per vehicle
#     ocr_confidence: 0.32     minimum EasyOCR confidence for a read
#     read_interval: 1.5       seconds between reads of the same track
#     exit_grace: 15           seconds a vehicle must be absent before its
#                              track is closed and counted (min 0.25)
#
#   multi_human
#     embed_every: 2           refresh a track's appearance every Nth frame
#     trail_limit: 0           trail points kept per person (0 = unlimited)
#     max_speed: 1.5           frame-widths/second; faster re-ID jumps are
#                              rejected (not calibrated to metres)
#     reid: histogram          histogram | null (null = never re-associate)
#     reid_threshold: 0.65     cosine similarity needed to fold a track back in
#     reid_ttl_seconds: 120    how long a lost person stays matchable
#
#   face
#     face_every: 5            run face detection every Nth frame per person
#     upper_frac: 0.55         top fraction of the person box searched
#     score_threshold: 0.75    YuNet detection score floor
#     model                    default: IBVAP_FACE_MODEL
#                              (data/face_detection_yunet_2023mar.onnx)
#     recognition_model        embedding model for watchlist matching
#     backend_url              default: from .env (IBVAP_BACKEND_HOST/PORT)
#     watchlist_refresh_seconds: 5   default: IBVAP_WATCHLIST_REFRESH_SECONDS
#
# ── ORDER MATTERS ───────────────────────────────────────────────────────
#
#   configure.py hangs the vision service (ibvap/main.py) off the FIRST
#   camera with detect: true, and the plate-scanner API (ai_service, :8001)
#   off the SECOND. They start when that camera's path becomes ready — so if
#   the first camera's clip is missing, the vision service never starts.
#   Keep a camera whose clip definitely exists at the top.

# defaults:
#   detect: true
#   modules: [fence, multi_human]

cameras:
  - id: cam_fence_north            # DB name: CCTV-01 Highway
    label: CCTV-01 Highway
    detect: true
    modules: [fence, anpr]
    source:
      kind: file
      path: clips/highway_cam.mp4

  - id: cam_farm_gate              # DB name: CCTV-02 Highway
    label: CCTV-02 Highway
    detect: true
    modules: [fence, anpr]
    source:
      kind: file
      path: clips/highway_cam2.mp4

  - id: cam_patrol_road            # DB name: Mall-Patrol
    label: Mall-Patrol
    detect: true
    modules: [multi_human, face]
    source:
      kind: file
      path: clips/mall_cctv.mp4
      url: https://youtu.be/SvldnZ6qMGU

  - id: cam_waterline              # DB name: Mall-Patrol 2
    label: Mall-Patrol 2
    detect: true
    modules: [multi_human, face]
    source:
      kind: file
      path: clips/Face_detection.mp4
      url: https://youtu.be/5CG-hLc1Eps

  - id: cam_garden                 # DB name: BOP-05 Garden
    label: BOP-05 Garden
    detect: true
    modules:
      fence: { clips: true }
      anpr: {}
      multi_human: {}
      face: {}
    source:
      kind: file
      path: clips/virtual_fence.mp4
      url: https://youtu.be/gz8N0kc90uU

  - id: cam_border_gate            # DB name: Pedestrian Gate
    label: Pedestrian Gate
    detect: true
    # Real monitoring footage and the approved ANPR demo source, so its
    # events are treated as operational rather than simulated.
    simulated: false
    # Vehicles are too small for the shared 384px pass at their first
    # readable approach; raise only this plate-facing camera.
    imgsz: 640
    modules: [fence, anpr, multi_human]
    source:
      kind: file
      path: clips/street_footage.mp4
      # url: https://youtu.be/dP1UQ59d0Vw
