# The camera manifest — the one place a camera is declared.
#
# Adding a camera is adding a block here. Nothing else changes: `configure.py`
# regenerates the media hub config from this file, the vision service reads the
# same file to know what to pull, and the console gets it from the backend.
#
# This file says WHAT cameras exist. `.env` says WHERE the modules run and
# which of these cameras THIS machine handles. Keep the split — this file is
# shared and committed, `.env` is per-machine and ignored.
#
# `id` MUST match a camera row seeded in backend/src/db/seed.ts. The backend
# rejects a frame for an unknown camera_id (l4/hooks.ts), so a typo here shows
# up as a worker that runs fine and produces no events.

# ── source kinds ─────────────────────────────────────────────────────────
#
#   file    loop a local clip forever. The v0 default.
#             path:  clips/whatever.mp4
#             url:   optional. `fetch.py` downloads this into `path` when the
#                    file is missing. Any yt-dlp-supported URL.
#
#   rtsp    a real camera. The day one arrives, change `kind` and drop the
#           URL in — the path name stays, so nothing downstream notices.
#             url:   rtsp://user:pass@10.0.0.14:554/Streaming/Channels/102
#             Credentials stay in this file and never reach the browser.
#
#   webcam  a local capture device (Windows DirectShow).
#             device: "Integrated Camera"   — exact name from
#                     ffmpeg -list_devices true -f dshow -i dummy
#
# ── per-camera keys ──────────────────────────────────────────────────────
#
#   detect: true|false   whether a vision worker runs on this camera.
#                        false still publishes video — the tile is live, it
#                        just has no boxes. That is a legitimate v0 state and
#                        the console shows it honestly.
#
#   modules:             which detection sub-modules run on this camera. The
#                        vision service loads one shared YOLO+ByteTrack pass per
#                        camera and hands its output to each of these; a module
#                        never runs a detector of its own.
#
#                        modules: [fence, anpr]          names, default params
#                        modules:                        names with params
#                          fence: {confirm_frames: 4}
#                          anpr:  {report_interval: 12}
#
#                        Omit it to take `defaults.modules` below. Available:
#                        fence (zone/line intrusion), anpr (plate reading),
#                        multi_human (person tracking; re-ID is interface-only).
#                        Fence ZONES are not configured here — they are drawn by
#                        an operator, stored by the edge node, and pulled from
#                        its /api/config while running, so an edit takes effect
#                        without touching this file or restarting a worker.

defaults:
  detect: true
  # Downscale on publish. Detection runs at --imgsz anyway, so pushing
  # 1080p into the hub buys nothing and costs decode on every worker.
  # null = publish at the source's own resolution.
  height: 480

  # Cheap by default: both are arithmetic over the shared detection pass. ANPR
  # is opt-in per camera because it loads EasyOCR and reads pixels — and
  # because plate reading only works where plates face the camera anyway.
  modules: [fence, multi_human]

cameras:
  - id: cam_fence_north
    label: BOP-01 Fence North
    detect: true
    source:
      kind: file
      path: clips/fence_north.mp4
      # url: https://www.youtube.com/watch?v=...

  - id: cam_farm_gate
    label: BOP-02 Farm Gate
    # Temporarily pointed at the same real people footage as cam_fence_north
    # (2026-09-25, multi-camera watchlist grid) -- there is no second real
    # clip yet, and a 5-tile grid with 4 empty placeholder tiles proves
    # nothing about cross-camera matching. anpr stays configured (it is
    # harmless, just idle -- fence_north.mp4 has no plates) so this camera
    # reverts to being the ANPR demo the instant it gets its own footage
    # back; nothing about ITS identity changes, only what it is fed.
    modules: [fence, anpr, multi_human, face]
    detect: true
    source:
      kind: file
      path: clips/fence_north.mp4
      # url: https://www.youtube.com/watch?v=...

  - id: cam_patrol_road
    label: BOP-03 Patrol Road
    # Same as cam_farm_gate above: real footage borrowed for now.
    modules: [fence, anpr, multi_human, face]
    detect: true
    source:
      kind: file
      path: clips/fence_north.mp4
      # url: https://www.youtube.com/watch?v=...

  - id: cam_waterline
    label: BOP-04 Waterline
    detect: true
    # Same as cam_farm_gate above: real footage borrowed for now.
    modules: [fence, anpr, multi_human, face]
    source:
      kind: file
      path: clips/fence_north.mp4
      # url: https://www.youtube.com/watch?v=...

  - id: cam_garden
    label: BOP-05 Garden
    detect: true
    # Real footage (a car park), unlike the synthetic test patterns on the
    # other paths -- so this is the one camera where detections actually
    # appear. ANPR is on because what is in frame is vehicles. face is on
    # too, alongside anpr, for the same multi-camera watchlist grid every
    # other camera got face added for.
    #
    # `clips` keeps a short ring of processed frames and cuts the seconds
    # either side of a confirmed crossing out of it, so an incident arrives
    # carrying the frames it was judged from. Opt-in per camera because the
    # ring costs real RAM (see ibvap/core/clip.py for the arithmetic), and
    # enabled here because this is the camera that actually produces
    # crossings. `clip_pre_seconds` / `clip_post_seconds` default to 4 and 2.
    modules:
      fence: { clips: true }
      anpr: {}
      multi_human: {}
      face: {}
    source:
      kind: file
      path: clips/virtual_fence.mp4
      # url: https://youtu.be/gz8N0kc90uU

  - id: cam_border_gate
    label: Border Gate
    detect: true
    # This replay contains real monitoring footage and is the approved ANPR
    # demo source. Keep its detections in the operational 12-hour capture list.
    simulated: false
    # Vehicles are too small for the shared CPU-friendly 384px detector at
    # their first readable approach. Raise only this plate-facing camera.
    imgsz: 640
    # Keep the source resolution for vehicle crops and number-plate OCR. The
    # detector still controls its own inference size, so this does not force
    # every YOLO pass to process the full source resolution.
    height: null
    modules: [fence, anpr, multi_human]
    source:
      kind: file
      path: clips/border_gate.mp4
      # url: https://youtu.be/dP1UQ59d0Vw
