<svg xmlns="http://www.w3.org/2000/svg" width="760" height="200" viewBox="0 0 760 200" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="760" height="200" rx="12" fill="#ffffff" stroke="#e2e8f0"/>

  <!-- Inputs -->
  <rect x="20" y="30" width="150" height="60" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="95" y="56" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">ibvap vision / sim</text>
  <text x="95" y="74" text-anchor="middle" font-size="11" fill="#475569">detections · clips</text>
  <rect x="20" y="110" width="150" height="60" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="95" y="136" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">Sensors</text>
  <text x="95" y="154" text-anchor="middle" font-size="11" fill="#475569">anti-drone, etc.</text>

  <!-- Backend -->
  <rect x="230" y="20" width="300" height="160" rx="10" fill="#eef2ff" stroke="#6366f1"/>
  <text x="380" y="44" text-anchor="middle" font-size="14" font-weight="600" fill="#312e81">Backend edge node · Bun + Express :8000</text>
  <rect x="250" y="56" width="260" height="24" rx="5" fill="#ffffff" stroke="#c7d2fe"/>
  <text x="380" y="72" text-anchor="middle" font-size="11" fill="#334155">L4 hooks · ingress + SSE stream</text>
  <rect x="250" y="86" width="260" height="24" rx="5" fill="#ffffff" stroke="#c7d2fe"/>
  <text x="380" y="102" text-anchor="middle" font-size="11" fill="#334155">L3 zones · events · incidents · audit</text>
  <rect x="250" y="116" width="260" height="24" rx="5" fill="#ffffff" stroke="#c7d2fe"/>
  <text x="380" y="132" text-anchor="middle" font-size="11" fill="#334155">L2 virtual fence · crossing judgement</text>
  <rect x="250" y="146" width="260" height="24" rx="5" fill="#fef9c3" stroke="#eab308"/>
  <text x="380" y="162" text-anchor="middle" font-size="11" fill="#713f12">SQLite · ibvap.db</text>

  <!-- Consumers -->
  <rect x="590" y="30" width="150" height="60" rx="10" fill="#ecfdf5" stroke="#059669"/>
  <text x="665" y="56" text-anchor="middle" font-size="13" font-weight="600" fill="#064e3b">Frontend console</text>
  <text x="665" y="74" text-anchor="middle" font-size="11" fill="#047857">REST + live SSE</text>
  <rect x="590" y="110" width="150" height="60" rx="10" fill="#fdf4ff" stroke="#c026d3"/>
  <text x="665" y="136" text-anchor="middle" font-size="13" font-weight="600" fill="#701a75">MCP → Agent</text>
  <text x="665" y="154" text-anchor="middle" font-size="11" fill="#86198f">investigation queries</text>

  <!-- Arrows -->
  <line x1="170" y1="60" x2="248" y2="66" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="170" y1="140" x2="248" y2="98" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="530" y1="68" x2="588" y2="60" stroke="#475569" stroke-width="1.6" marker-end="url(#a)" marker-start="url(#a)"/>
  <line x1="530" y1="110" x2="588" y2="140" stroke="#475569" stroke-width="1.6" marker-end="url(#a)" marker-start="url(#a)"/>
</svg>
