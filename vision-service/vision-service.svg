<svg xmlns="http://www.w3.org/2000/svg" width="760" height="200" viewBox="0 0 760 200" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="760" height="200" rx="12" fill="#ffffff" stroke="#e2e8f0"/>

  <!-- Cameras -->
  <rect x="20" y="70" width="130" height="60" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="85" y="97" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">Cameras</text>
  <text x="85" y="115" text-anchor="middle" font-size="11" fill="#475569">RTSP via media hub</text>

  <!-- Vision service -->
  <rect x="200" y="20" width="340" height="160" rx="10" fill="#eef2ff" stroke="#6366f1"/>
  <text x="370" y="44" text-anchor="middle" font-size="14" font-weight="600" fill="#312e81">Vision service · Python, CPU-only</text>
  <rect x="216" y="56" width="308" height="28" rx="6" fill="#ffffff" stroke="#c7d2fe"/>
  <text x="370" y="75" text-anchor="middle" font-size="11" fill="#334155">capture → ONE YOLO11n + ByteTrack pass per frame</text>
  <rect x="216" y="94" width="72" height="28" rx="6" fill="#ffffff" stroke="#c7d2fe"/>
  <text x="252" y="113" text-anchor="middle" font-size="11" fill="#334155">fence</text>
  <rect x="294" y="94" width="72" height="28" rx="6" fill="#ffffff" stroke="#c7d2fe"/>
  <text x="330" y="113" text-anchor="middle" font-size="11" fill="#334155">anpr</text>
  <rect x="372" y="94" width="72" height="28" rx="6" fill="#ffffff" stroke="#c7d2fe"/>
  <text x="408" y="113" text-anchor="middle" font-size="11" fill="#334155">people</text>
  <rect x="450" y="94" width="74" height="28" rx="6" fill="#ffffff" stroke="#c7d2fe"/>
  <text x="487" y="113" text-anchor="middle" font-size="11" fill="#334155">face</text>
  <text x="370" y="148" text-anchor="middle" font-size="11" fill="#4338ca">judges crossings · reads plates · tracks people</text>
  <text x="370" y="166" text-anchor="middle" font-size="10" fill="#64748b">never writes a DB · never takes commands</text>

  <!-- Outputs -->
  <rect x="590" y="30" width="150" height="60" rx="10" fill="#fdf4ff" stroke="#c026d3"/>
  <text x="665" y="54" text-anchor="middle" font-size="13" font-weight="600" fill="#701a75">Console (live)</text>
  <text x="665" y="72" text-anchor="middle" font-size="11" fill="#86198f">WS :8100 · boxes, droppable</text>
  <rect x="590" y="110" width="150" height="60" rx="10" fill="#ecfdf5" stroke="#059669"/>
  <text x="665" y="134" text-anchor="middle" font-size="13" font-weight="600" fill="#064e3b">Backend (durable)</text>
  <text x="665" y="152" text-anchor="middle" font-size="11" fill="#047857">HTTP :8000 · events, retried</text>

  <!-- Arrows -->
  <line x1="150" y1="100" x2="198" y2="100" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="540" y1="80" x2="588" y2="62" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="540" y1="120" x2="588" y2="140" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>
</svg>
