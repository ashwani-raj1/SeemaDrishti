<svg xmlns="http://www.w3.org/2000/svg" width="760" height="200" viewBox="0 0 760 200" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="760" height="200" rx="12" fill="#ffffff" stroke="#e2e8f0"/>

  <!-- Operator -->
  <rect x="20" y="70" width="130" height="60" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="85" y="97" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">Operator</text>
  <text x="85" y="115" text-anchor="middle" font-size="11" fill="#475569">asks in plain words</text>

  <!-- Agent -->
  <rect x="210" y="40" width="200" height="120" rx="10" fill="#eef2ff" stroke="#6366f1"/>
  <text x="310" y="66" text-anchor="middle" font-size="14" font-weight="600" fill="#312e81">Investigation Agent</text>
  <text x="310" y="84" text-anchor="middle" font-size="11" fill="#4338ca">Google ADK · agent.ts</text>
  <text x="310" y="110" text-anchor="middle" font-size="11" fill="#334155">skills/ → how to investigate</text>
  <text x="310" y="128" text-anchor="middle" font-size="11" fill="#334155">llm/ → OpenRouter model</text>
  <text x="310" y="146" text-anchor="middle" font-size="11" fill="#334155">mcp/ → SeemaDrishti tools</text>

  <!-- LLM -->
  <rect x="470" y="20" width="270" height="60" rx="10" fill="#fdf4ff" stroke="#c026d3"/>
  <text x="605" y="46" text-anchor="middle" font-size="13" font-weight="600" fill="#701a75">LLM (OpenRouter)</text>
  <text x="605" y="64" text-anchor="middle" font-size="11" fill="#86198f">reasons · picks tools · has fallbacks</text>

  <!-- MCP -->
  <rect x="470" y="120" width="270" height="60" rx="10" fill="#ecfdf5" stroke="#059669"/>
  <text x="605" y="146" text-anchor="middle" font-size="13" font-weight="600" fill="#064e3b">SeemaDrishti MCP :13000</text>
  <text x="605" y="164" text-anchor="middle" font-size="11" fill="#047857">cameras · zones · events · incidents · clips</text>

  <!-- Arrows -->
  <line x1="150" y1="92" x2="208" y2="92" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="208" y1="110" x2="152" y2="110" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="180" y="130" text-anchor="middle" font-size="10" fill="#64748b">answer</text>
  <line x1="410" y1="75" x2="468" y2="55" stroke="#475569" stroke-width="1.6" marker-end="url(#a)" marker-start="url(#a)"/>
  <line x1="410" y1="125" x2="468" y2="145" stroke="#475569" stroke-width="1.6" marker-end="url(#a)" marker-start="url(#a)"/>
</svg>
